name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    name: Build Go Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.4'
          # v0.5.3: `cache-path` is not a setup-go input (cache never restored
          # and a warning was emitted); the valid input is cache-dependency-path.
          cache-dependency-path: src-go/go.sum
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --config ../.goreleaser.yaml
          workdir: src-go
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
